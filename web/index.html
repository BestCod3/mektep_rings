<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mektep_rings">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Audioplayers Web үчүн маанилүү скрипт -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.4"></script> <!-- Стабилдүү версия -->

  <title>mektep_rings</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Flutter скрипти -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Audioplayers инициализациясы -->
  <script>
    document.addEventListener('flutter-first-frame', () => {
      try {
        if (window.audioplayersWeb) {
          window.audioplayersWeb.initialize();
          console.log('[Audioplayers] Web инициализациясы ийгиликтүү!');
        } else {
          console.warn('[Audioplayers] window.audioplayersWeb жок!');
        }
      } catch (e) {
        console.error('[Audioplayers] Инициализация катасы:', e);
      }
    });
  </script>

  <!-- JavaScript өчүрүлгөн учурлар үчүн -->
  <noscript>
    <p>Бул колдонмо иштеши үчүн JavaScript жарактуу болушу керек.</p>
  </noscript>
</body>

</html>
